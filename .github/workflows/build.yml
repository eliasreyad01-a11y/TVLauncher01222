name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [iptv-app]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/*.apk LiteIPTV.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LiteIPTV-apk
          path: LiteIPTV.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" LiteIPTV.apk --title "LiteIPTV build ${{ github.run_number }}" --notes "Debug-signed APK. Install over the previous one."
